name: CI

on:
  push:
    branches: [main, 'codex/v1.0-rc.*', 'trae/v1.0-rc.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Check runtime
        run: node --version
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Check release environment profile
        run: node scripts/rc-env-check.mjs
        env:
          PUBLIC_ORIGIN: http://127.0.0.1:8787
          HOST: 127.0.0.1
          NODE_ENV: development
      - name: Rehearse backup and restore
        run: node scripts/wayline-backup-drill.mjs
      - run: npm test
      - run: npm run build
      - name: Check isolated release process
        run: |
          PORT=18949 HOST=127.0.0.1 node server/index.mjs > "$RUNNER_TEMP/wayline-preflight.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:18949/healthz > /dev/null; then break; fi
            sleep 1
          done
          node scripts/rc-preflight.mjs http://127.0.0.1:18949
